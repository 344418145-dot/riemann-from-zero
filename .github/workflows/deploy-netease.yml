name: Deploy course to NetEase Cloud VM
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: netease-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.NETEASE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate course syntax
        run: node --check app.js
      - name: Prepare trusted SSH
        env:
          SSH_KEY: ${{ secrets.NETEASE_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.NETEASE_SSH_HOST }}
          SSH_USER: ${{ secrets.NETEASE_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.NETEASE_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.NETEASE_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_deploy"
          chmod 600 "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Sync and restart service
        env:
          DEPLOY_HOST: ${{ secrets.NETEASE_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.NETEASE_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.NETEASE_SSH_PORT }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/riemann-from-zero/deploy/netease'
          rsync -av -e "ssh $SSH_OPTS"             index.html styles.css app.js compose.yaml             "$DEPLOY_USER@$DEPLOY_HOST:/opt/riemann-from-zero/"
          rsync -av -e "ssh $SSH_OPTS"             deploy/netease/Caddyfile             "$DEPLOY_USER@$DEPLOY_HOST:/opt/riemann-from-zero/deploy/netease/"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST"             'set -eu; cd /opt/riemann-from-zero; test -f .env; docker compose config --quiet; docker compose up -d --force-recreate; docker compose exec -T course caddy validate --config /etc/caddy/Caddyfile; docker compose ps; curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --resolve lxxlovechelsea.top:443:127.0.0.1 https://lxxlovechelsea.top/ > /dev/null'
